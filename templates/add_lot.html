<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Lot</title>
    <link rel="stylesheet" href="/static/css/add_lot.css"/>
</head>
<body>
    <h2>Add New Parking Lot</h2>
<form method="POST">
    <label>Prime Location Name:</label>
    <input type="text" name="prime_location_name" required><br>

    <label>Price:</label>
    <input type="number" name="price" required><br>

    <label>Address:</label>
    <input type="text" name="Address" required><br>

    <label>Pincode:</label>
    <input type="text" name="Pincode" maxlength="6" required><br>

    <label>Maximum Number of Spots:</label>
    <input type="number" name="maximum_number_of_spots" required><br>

    <button type="submit">Add Lot</button>
</form>
{% if message %}
<p style="color: red; text-align: center;">{{ message }}</p>
{% endif %}
<a href="{{ url_for('admin_dashboard') }}">← Back to Dashboard</a>

</body>
</html>
