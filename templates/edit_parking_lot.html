<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Parking lot</title>
    <link rel="stylesheet" href="/static/css/edit_parking_lot.css"/>
</head>
<body>
    <div class="edit-form">
    <h2>Edit Parking Lot</h2>
    <form method="POST" action="{{ url_for('edit_parking_lot', lot_id=lot.id) }}">
        <label>Parking Location Name:</label>
            <input type="text" name="name" value="{{ lot.name }}" readonly>
        

        <label>Address:</label>
            <textarea name="address" rows="3" readonly>{{ lot.address }}</textarea>
        

        <label>Pincode:</label>
            <input type="text" name="pincode" value="{{ lot.pincode }}" readonly>
        

        <label>Price (per hour):
            <input type="number" name="price_per_hour" value="{{ lot.price_per_hour }}" required>
        </label>

        <label>Maximum Spots:
            <input type="number" name="max_spots" value="{{ lot.maximum_number_of_spots }}" required>
        </label>

        <div class="form-buttons">
            <button type="submit" class="update">Update</button>
            <a href="{{ url_for('admin_dashboard') }}" class="cancel">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
