<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - ParkEase</title>
  <link rel="stylesheet" href="/static/css/login.css"/>
</head>
<body>
  <body>
  <div class="page-wrapper">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flashes">
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <div class="login-container">
      <h2>Login to ParkEase</h2>
      <form action="/login" method="post">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />
        </div>
        <button type="submit">Login</button>
        <p class="signup-link">Don't have an account? <a id ="text" href="{{ url_for('signup') }}">Sign up</a></p>
        <p class="signup-link">Admin? <a id="text" href="{{ url_for('admin') }}">Login here</a></p>
      </form> 
      <p class="home-link">
        <a href="{{ url_for('home') }}">← Back to Home</a>
      </p>
    </div>
  </div>
</body>
</html>
